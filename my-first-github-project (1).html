<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First GitHub Project</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      width: min(100%, 520px);
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
    }

    h1 {
      margin-top: 0;
      color: #2563eb;
    }

    p {
      line-height: 1.6;
    }

    button {
      margin-top: 12px;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      font-weight: bold;
      color: #15803d;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, GitHub!</h1>
    <p>
      This is my first web development project.
      I am learning HTML, CSS, and JavaScript as part of my
      full-stack development journey.
    </p>

    <button id="welcomeButton">Click Me</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    const button = document.getElementById("welcomeButton");
    const message = document.getElementById("message");

    button.addEventListener("click", function () {
      message.textContent = "Congratulations! Your JavaScript is working.";
    });
  </script>
</body>
</html>
